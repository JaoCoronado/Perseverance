<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mars Landscape</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23c1440e'/></svg>" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #c98a55; }
      canvas { display: block; }
      .hud {
        position: fixed; left: 16px; bottom: 16px; min-width: 200px;
        padding: 12px 14px; border-radius: 8px;
        background: rgba(40, 18, 8, 0.6);
        border: 1px solid rgba(255, 210, 170, 0.18);
        color: #f6e2cf; font: 12px/1.6 ui-monospace, Consolas, monospace;
        pointer-events: none; user-select: none;
      }
      .hud-title { letter-spacing: 0.12em; font-weight: 700; margin-bottom: 6px; color: #ffc896; }
      .hud-row { display: flex; justify-content: space-between; gap: 16px; }
      .hud-row b { font-variant-numeric: tabular-nums; font-weight: 600; }
      .hud-hint { margin-top: 8px; opacity: 0.65; font-size: 11px; }

      .mission-control {
        --mc-line: #ffb27a; --mc-grid: rgba(246, 226, 207, 0.45);
        position: fixed; top: 16px; right: 16px; width: 320px; max-height: calc(100% - 32px);
        overflow-y: auto; display: grid; gap: 6px; padding: 10px;
        background: rgba(30, 13, 6, 0.72); border: 1px solid rgba(255, 210, 170, 0.18); border-radius: 8px;
        color: #f6e2cf; font: 12px/1.5 ui-monospace, Consolas, monospace;
      }
      .mission-control[hidden] { display: none; }
      .mc-title { letter-spacing: 0.16em; font-weight: 700; color: #ffc896; }
      .mc-sub { opacity: 0.7; font-size: 11px; }
      .mc-sub kbd {
        border: 1px solid rgba(255, 210, 170, 0.4); border-radius: 3px; padding: 0 4px; font: inherit;
      }
      .mc-card {
        display: grid; gap: 2px; padding: 7px 10px; border-radius: 6px;
        background: rgba(255, 200, 150, 0.06); border-left: 2px solid #ffb27a;
      }
      .mc-card.is-error { border-left-color: #ff6b5b; }
      .mc-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .mc-name { font-weight: 700; }
      .mc-provider { font-size: 10px; opacity: 0.65; text-align: right; }
      .mc-provider.is-live::before {
        content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%;
        background: #7dff9b; animation: mc-blink 1.6s ease-in-out infinite;
      }
      .mc-value { font-size: 18px; line-height: 1.3; font-weight: 600; font-variant-numeric: tabular-nums; color: #fff1e3; }
      .mc-chart { width: 100%; height: 42px; display: block; }
      .mc-meaning { margin: 0; font-size: 11px; line-height: 1.4; opacity: 0.8; font-family: system-ui, sans-serif; }
      @keyframes mc-blink { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .mc-provider.is-live::before { animation: none; } }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
